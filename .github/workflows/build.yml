name: Build SculpT APK and PWA ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize platform files
        run: flutter create --project-name sculpt --org com.nocode5 .

      - name: Configure Android label and permissions
        run: |
          sed -i 's/android:label="sculpt"/android:label="SculpT"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Apply persistent signing keystore if present
        run: |
          if [ -f android_signing/sculpt.keystore ]; then
            cp android_signing/sculpt.keystore ~/.android/debug.keystore
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build PWA Web App
        run: flutter build web --release --pwa-strategy=offline-first

      - name: Package identical SculpT.apk and SculpT.zip (PWA + Source)
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/SculpT.apk
          zip -r release_assets/SculpT.zip build/web lib assets pubspec.yaml README.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SculpT-Build
          path: release_assets/
