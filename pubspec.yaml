name: sculpt
description: Sculpt yourself to a T - Aesthetic & Occupational fitness advisor.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/sculpt_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/sculpt_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sculpt_hero.png
    - assets/sculpt_icon.png
